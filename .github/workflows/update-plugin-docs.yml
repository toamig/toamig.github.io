# Triggered when a plugin repo dispatches a "plugin-released" event.
# Two modes driven by client_payload.mode:
#   full        — rewrites the entire docs page from source (pre-release and 1.0)
#   incremental — updates only sections changed in this version (1.1 and beyond)
# The existing deploy.yml takes over after this pushes to master.
#
# Required secrets:
#   ANTHROPIC_API_KEY   — for the Claude Code docs-writing step

name: Update Plugin Docs

on:
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout docs repo ─────────────────────────────────────────────
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Sparse-checkout the plugin's source + changelog ────────────────
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.plugin_repo }}
          path: plugin-source
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          sparse-checkout: |
            Source
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      # ── 3. Update version in plugins.json ────────────────────────────────
      - name: Update plugins.json version
        env:
          PLUGIN_NAME: ${{ github.event.client_payload.plugin_name }}
          VERSION:     ${{ github.event.client_payload.version }}
        run: |
          python3 << 'PYEOF'
          import json, os

          plugin_name = os.environ["PLUGIN_NAME"]
          version     = os.environ["VERSION"]

          with open("src/data/plugins.json") as f:
              plugins = json.load(f)

          matched = False
          for p in plugins:
              if p["name"].replace(" ", "") == plugin_name or p["name"] == plugin_name:
                  p["version"] = version
                  matched = True
                  print(f"Updated '{p['name']}' to v{version}")
                  break

          if not matched:
              print(f"WARNING: '{plugin_name}' not found in plugins.json — version not updated")

          with open("src/data/plugins.json", "w") as f:
              json.dump(plugins, f, indent=2)
              f.write("\n")
          PYEOF

      # ── 4. Install Claude Code CLI ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install project dependencies
        run: npm ci

      # ── 5. Claude Code updates the plugin's .astro docs page ─────────────
      - name: Update docs page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUGIN_NAME:       ${{ github.event.client_payload.plugin_name }}
          VERSION:           ${{ github.event.client_payload.version }}
          MODE:              ${{ github.event.client_payload.mode }}
        run: |
          if [ "$MODE" = "full" ]; then
            TASK="Fully regenerate the documentation page for the $PLUGIN_NAME plugin (version $VERSION).

          The API may have changed significantly since the last version.
          Rewrite the entire page from scratch using the current source headers as the source of truth.
          Do not preserve existing page content — treat this as a fresh first-time write.
          Use plugin-source/CHANGELOG.md ## [1.0] section to understand what the plugin ships with.
          Use plugin-source/Source/ .h headers for all class names, function signatures, and enums.
          Use src/pages/Plugins/GearFlow.astro as the structural and visual template.

          This is FULL REGENERATION mode. Read CLAUDE.md for all writing rules."
          else
            TASK="Update the documentation page for the $PLUGIN_NAME plugin (version $VERSION).

          Read plugin-source/CHANGELOG.md — find the ## [$VERSION] section.
          Update only the sections that correspond to entries in that version's changelog.
          Preserve all existing content that has no corresponding changelog entry.
          Add new sections for new systems. Update existing sections only if behavior changed.

          This is INCREMENTAL mode. Read CLAUDE.md for all writing rules."
          fi

          claude --dangerously-skip-permissions --print "
          $TASK

          Plugin source:  plugin-source/
          Changelog:      plugin-source/CHANGELOG.md
          Docs page:      src/pages/Plugins/$PLUGIN_NAME.astro
          "

          # ── Build validation + self-healing loop ──────────────────────────
          MAX_ATTEMPTS=3
          attempt=0

          while ! npm run build > build_output.txt 2>&1; do
            attempt=$((attempt + 1))
            echo "Build failed (attempt $attempt / $MAX_ATTEMPTS)"

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Build still failing after $MAX_ATTEMPTS fix attempts"
              cat build_output.txt
              exit 1
            fi

            BUILD_ERRORS=$(cat build_output.txt)

            claude --dangerously-skip-permissions --print "
          The Astro page you wrote at src/pages/Plugins/$PLUGIN_NAME.astro has build errors.
          Fix the file. Do not change any content — only fix syntax issues.
          Read CLAUDE.md for the correct code block format and curly brace escaping rules.

          Build errors:
          $BUILD_ERRORS
          "
          done

          echo "Build passed after $((attempt + 1)) attempt(s)."

      # ── 6. Commit and push — existing deploy.yml handles the rest ─────────
      - name: Commit and push
        env:
          PLUGIN_NAME:         ${{ github.event.client_payload.plugin_name }}
          VERSION:             ${{ github.event.client_payload.version }}
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "docs: $PLUGIN_NAME v$VERSION"
          # Push with PAT so the push event triggers deploy.yml
          # (pushes made with GITHUB_TOKEN are intentionally blocked from triggering workflows)
          git push "https://x-access-token:${DOCS_DISPATCH_TOKEN}@github.com/toamig/toamig.github.io.git" master
