# Triggered when a plugin repo dispatches a "plugin-released" event.
# Updates plugins.json version, then uses Claude Code to update the plugin's .astro page.
# The existing deploy.yml takes over after this pushes to master.
#
# Required secrets:
#   ANTHROPIC_API_KEY   — for the Claude Code docs-writing step

name: Update Plugin Docs

on:
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout docs repo ─────────────────────────────────────────────
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Sparse-checkout the plugin's source + changelog ────────────────
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.plugin_repo }}
          path: plugin-source
          sparse-checkout: |
            Source
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      # ── 3. Update version in plugins.json ────────────────────────────────
      - name: Update plugins.json version
        env:
          PLUGIN_NAME: ${{ github.event.client_payload.plugin_name }}
          VERSION:     ${{ github.event.client_payload.version }}
        run: |
          python3 << 'PYEOF'
          import json, os

          plugin_name = os.environ["PLUGIN_NAME"]
          version     = os.environ["VERSION"]

          with open("src/data/plugins.json") as f:
              plugins = json.load(f)

          matched = False
          for p in plugins:
              # Strip spaces so "Cascade Combat System" matches "CascadeCombatSystem"
              if p["name"].replace(" ", "") == plugin_name or p["name"] == plugin_name:
                  p["version"] = version
                  matched = True
                  print(f"Updated '{p['name']}' to v{version}")
                  break

          if not matched:
              print(f"WARNING: '{plugin_name}' not found in plugins.json — version not updated")

          with open("src/data/plugins.json", "w") as f:
              json.dump(plugins, f, indent=2)
              f.write("\n")
          PYEOF

      # ── 4. Install Claude Code CLI ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # ── 5. Claude Code updates the plugin's .astro docs page ─────────────
      - name: Update docs page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUGIN_NAME:       ${{ github.event.client_payload.plugin_name }}
          VERSION:           ${{ github.event.client_payload.version }}
        run: |
          claude --dangerously-skip-permissions --print "
          Update the documentation page for the $PLUGIN_NAME plugin, version $VERSION.

          Plugin source:  plugin-source/
          Changelog:      plugin-source/CHANGELOG.md
          Docs page:      src/pages/Plugins/$PLUGIN_NAME.astro

          Steps:
          1. Read plugin-source/CHANGELOG.md — find the ## [$VERSION] section
          2. Read .h headers in plugin-source/Source/ for class and function names
          3. Read src/pages/Plugins/$PLUGIN_NAME.astro if it exists

          If the page EXISTS: update only what the changelog says changed for v$VERSION.
          If the page does NOT EXIST: create it from scratch using GearFlow.astro as the template.

          All writing rules, quality standards, and structural guidelines are in CLAUDE.md.
          Read it before writing anything.
          "

      # ── 6. Commit and push — existing deploy.yml handles the rest ─────────
      - name: Commit and push
        env:
          PLUGIN_NAME: ${{ github.event.client_payload.plugin_name }}
          VERSION:     ${{ github.event.client_payload.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "docs: $PLUGIN_NAME v$VERSION"
          git push origin master
