name: Deploy to GitHub Pages

# Content edited from /admin does NOT auto-deploy. The dashboard commits each
# save and image upload straight to master, so auto-deploying on push meant one
# full build per keystroke-sized change. Those paths are ignored here and the
# "Publish site" button in /admin fires this workflow once, when editing is done.
#
# Everything else (page code, layouts, styles, workflows) still deploys on push.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'src/data/**'
      - 'public/plugins/**'
      - 'public/events/**'
      - 'public/experience/**'
      - 'public/education/**'
      - 'public/projects/**'
      - 'public/technologies/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Supersede a build that is already running: if Publish is pressed twice,
    # or a push lands mid-build, only the newest source state is worth building.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The installed dependencies, keyed on the lockfile, so npm ci only runs
      # when a dependency changed. Puppeteer's Chromium is left out: it is only
      # needed when a CV page changed, and scripts/generate-cv-pdfs.mjs fetches
      # it then, rather than every run restoring a few hundred MB for nothing.
      - name: Restore dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-v1-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # Rendered OG / social images, keyed on the data and assets they are drawn
      # from (see src/lib/og-cache.ts). These dominate build time, and almost no
      # deploy changes all of them.
      - name: Restore OG image cache
        uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-v1-${{ github.sha }}
          restore-keys: og-v1-

      # The console's derived artwork (scripts/prepare-console-art.mjs), with the
      # manifest that says what each image was made from. The key follows the
      # sources, so a deploy that changes no image restores an exact match and
      # saves nothing; otherwise the nearest one is restored and only the
      # changed images are redone.
      - name: Restore console art cache
        uses: actions/cache@v4
        with:
          path: |
            public/console
            public/tiles
            .cache/console-art.json
          key: console-art-v1-${{ hashFiles('scripts/prepare-console-art.mjs', 'src/data/*.json', 'public/**') }}
          restore-keys: console-art-v1-

      # The last printed CV PDFs with the fingerprint of the page each came
      # from (scripts/generate-cv-pdfs.mjs). A deploy that leaves the CV pages
      # alone copies them instead of starting Chromium.
      - name: Restore CV PDF cache
        uses: actions/cache@v4
        with:
          path: .cache/cv-pdfs
          key: cv-pdfs-v1-${{ github.sha }}
          restore-keys: cv-pdfs-v1-

      - uses: actions/configure-pages@v4
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A deployment that has started should always finish, so this group never
    # cancels in progress. Queued duplicates behind it are dropped by GitHub.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
